services:
  vpspulse:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.hub
    container_name: vpspulse-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - VPSP_PUBLIC_URL=https://monitor.example.com
      - VPSP_TRUST_PROXY=true
      # Optional: auto-create admin user on first boot (min 8 chars)
      # - VPSP_ADMIN_USER=admin
      # - VPSP_ADMIN_PASSWORD=changeme123
    volumes:
      - vpspulse_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  vpspulse_data:
